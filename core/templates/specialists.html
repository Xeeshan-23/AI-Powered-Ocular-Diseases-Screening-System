{% extends 'base.html' %}
{% load static %}

{% block title %}Find Specialist - Ocular AI{% endblock %}

{% block content %}
<!-- MapLibre GL CSS -->
<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />

<div class="row mb-4 mt-3">
    <div class="col-md-8">
        <h2 class="fw-bold mb-0">Find a Specialist</h2>
        <p class="text-muted">Connect with top ophthalmologists and eye care professionals near you.</p>
    </div>
    <div class="col-md-4">
        <div class="d-flex gap-2">
            <!-- Search Input -->
            <input class="form-control rounded-pill" type="text" id="customLocation" placeholder="Search city (e.g., Lahore)">
            
            <!-- GPS Button -->
            <button type="button" class="btn btn-outline-secondary rounded-circle" onclick="useGPSLocation()" title="Use My GPS">
                <i class="fas fa-crosshairs"></i>
            </button>
            
            <!-- Search Button -->
            <button class="btn btn-primary rounded-circle" type="button" onclick="searchCustomLocation()">
                <i class="fas fa-search"></i>
            </button>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-md-4 mb-4">
        <div class="card shadow-sm border-0 h-100">
            <div class="card-header bg-white border-bottom p-3">
                <h5 class="fw-bold text-primary mb-0"><i class="fas fa-user-md me-2"></i>Nearby Clinics</h5>
                <small class="text-muted" id="status-text">Detecting your location...</small>
            </div>
            <div class="card-body p-0 overflow-auto" style="height: 65vh;" id="results-list">
                <div class="text-center mt-5" id="loading-spinner">
                    <div class="spinner-border text-primary" role="status"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="col-md-8 mb-4">
        <div class="card shadow-sm border-0 h-100">
            <div class="card-body p-0">
                <!-- Map Container -->
                <div id="map" style="height: 65vh; width: 100%; border-radius: 0 5px 5px 0; background-color: #f8f9fa;"></div>
            </div>
        </div>
    </div>
</div>

<!-- MapLibre GL JS -->
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

<script>
// Initialize MapLibre with OpenFreeMap Liberty Style
const map = new maplibregl.Map({
    container: 'map',
    style: 'https://tiles.openfreemap.org/styles/liberty', // Free 3D Vector Tiles
    center: [73.0479, 33.5973], // Note: MapLibre uses [Longitude, Latitude]
    zoom: 14,
    pitch: 45, // Angled for 3D view
    bearing: -17.6 // Slight rotation
});

// Add Navigation Controls (Zoom & Rotation)
map.addControl(new maplibregl.NavigationControl(), 'top-right');

let currentMarkers = [];

// 1. Geolocation Logic
function useGPSLocation() {
    document.getElementById("status-text").innerText = "Locating you via GPS...";
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                loadMapArea(lat, lng, "Showing clinics near your GPS location");
            },
            (error) => loadMapArea(33.5973, 73.0479, "GPS denied. Showing Rawalpindi area."),
            { timeout: 10000 }
        );
    }
}

// 2. Load Area & Fetch Data
function loadMapArea(lat, lng, statusMsg) {
    document.getElementById("status-text").innerText = statusMsg;
    
    // Fly smoothly to new location using WebGL hardware acceleration
    map.flyTo({ center: [lng, lat], zoom: 14, essential: true });

    // Clear old markers
    currentMarkers.forEach(marker => marker.remove());
    currentMarkers = [];

    // Add Blue User Pin
    const userMarker = new maplibregl.Marker({ color: "#3b82f6" })
        .setLngLat([lng, lat])
        .setPopup(new maplibregl.Popup().setHTML("<b style='color: black;'>You are here</b>"))
        .addTo(map);
    currentMarkers.push(userMarker);

    // Call the strict real data API fetcher
    fetchRealClinics(lat, lng);
}

// 3. Strict Real Data API Integration (Using POST Request)
function fetchRealClinics(centerLat, centerLng) {
    const listContainer = document.getElementById("results-list");
    listContainer.innerHTML = '<div class="text-center mt-5"><div class="spinner-border text-primary" role="status"></div><p class="mt-2 text-muted">Searching map...</p></div>';
    
    const overpassQuery = `
        [out:json][timeout:25];
        (
          node["amenity"="hospital"](around:5000,${centerLat},${centerLng});
          node["amenity"="clinic"](around:5000,${centerLat},${centerLng});
          node["healthcare"="doctor"](around:5000,${centerLat},${centerLng});
        );
        out 15;
    `;

    // Using POST instead of GET prevents URL length errors and bypasses strict browser CORS caching
    fetch("https://overpass-api.de/api/interpreter", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: `data=${encodeURIComponent(overpassQuery)}`
    })
        .then(res => {
            if (!res.ok) throw new Error(`API Error: ${res.status}`);
            return res.json();
        })
        .then(data => {
            listContainer.innerHTML = "";
            
            const validClinics = data.elements ? data.elements.filter(clinic => clinic.tags && clinic.tags.name) : [];

            if (validClinics.length > 0) {
                validClinics.forEach(clinic => {
                    const address = clinic.tags["addr:street"] || clinic.tags["addr:full"] || "Address not provided";
                    addClinicToMap(clinic.tags.name, address, clinic.lat, clinic.lon, listContainer);
                });
            } else {
                listContainer.innerHTML = `
                    <div class="text-center mt-5 p-3">
                        <i class="fas fa-search-location fa-3x text-muted mb-3"></i>
                        <h6 class="text-muted fw-bold">No registered clinics found.</h6>
                        <small class="text-muted">We couldn't find any medical centers within 5km of this location on OpenStreetMap.</small>
                    </div>
                `;
            }
        })
        .catch(err => {
            console.error("OSM API Error:", err);
            listContainer.innerHTML = `
                <div class="text-center mt-5 p-3 text-danger">
                    <i class="fas fa-exclamation-triangle fa-2x mb-3"></i>
                    <h6 class="fw-bold">Connection Error</h6>
                    <small>The map server rejected the request. If this persists, try connecting your laptop to a mobile hotspot to refresh your IP address.</small>
                </div>
            `;
        });
}

// 4. Render Clinics & Red Markers
function addClinicToMap(name, address, lat, lng, container) {
    // Red Marker
    const marker = new maplibregl.Marker({ color: "#ef4444" })
        .setLngLat([lng, lat])
        .setPopup(new maplibregl.Popup({ offset: 25 }).setHTML(`
            <b style="color: black; font-size: 14px;">${name}</b><br>
            <span style="color: gray;">${address}</span><br>
            <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name + ' ' + address)}" target="_blank" style="color: #3b82f6; text-decoration: underline; font-size: 12px;">View on Google Maps</a>
        `))
        .addTo(map);
    currentMarkers.push(marker);

    // Sidebar Item
    const div = document.createElement("div");
    div.className = "card border-0 border-bottom rounded-0 p-3 list-group-item-action";
    div.style.cursor = "pointer";
    div.innerHTML = `
        <div class="d-flex align-items-center">
            <div class="bg-danger text-white rounded-circle d-flex align-items-center justify-content-center flex-shrink-0" style="width: 40px; height: 40px;">
                ${name.charAt(0)}
            </div>
            <div class="ms-3 flex-grow-1">
                <h6 class="mb-0 fw-bold text-dark">${name}</h6>
                <small class="text-muted"><i class="fas fa-map-marker-alt me-1"></i>${address}</small>
            </div>
        </div>
    `;
    
    div.addEventListener("click", () => {
        map.flyTo({ center: [lng, lat], zoom: 16 });
        marker.togglePopup();
    });

    container.appendChild(div);
}

// Start GPS once the map finishes its initial WebGL mount
map.on('load', () => {
    useGPSLocation();
});

// 5. Custom Location Search (Geocoding)
function searchCustomLocation() {
    const cityInput = document.getElementById("customLocation").value.trim();
    if (!cityInput) {
        alert("Please enter a city or location name.");
        return;
    }

    const listContainer = document.getElementById("results-list");
    document.getElementById("status-text").innerText = `Searching for ${cityInput}...`;
    listContainer.innerHTML = '<div class="text-center mt-5"><div class="spinner-border text-primary" role="status"></div><p class="mt-2 text-muted">Searching map...</p></div>';

    // Call Nominatim API to convert city name to Lat/Lng coordinates
    fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(cityInput)}`)
        .then(response => response.json())
        .then(data => {
            if (data && data.length > 0) {
                const lat = parseFloat(data[0].lat);
                const lng = parseFloat(data[0].lon);
                
                // Move the map and fetch new clinics for these coordinates
                loadMapArea(lat, lng, `Showing clinics in ${cityInput}`);
            } else {
                alert("Could not find that location. Please try a different name.");
                document.getElementById("status-text").innerText = "Search failed.";
                listContainer.innerHTML = "<p class='p-3 text-muted text-center'>Location not found.</p>";
            }
        })
        .catch(err => {
            console.error("Geocoding Error:", err);
            alert("Search failed. Please check your internet connection.");
            document.getElementById("status-text").innerText = "Network Error.";
        });
}

// Trigger search when the user presses "Enter" on their keyboard
document.addEventListener("DOMContentLoaded", () => {
    const searchInput = document.getElementById("customLocation");
    if (searchInput) {
        searchInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                searchCustomLocation();
            }
        });
    }
});
</script>
{% endblock %}
