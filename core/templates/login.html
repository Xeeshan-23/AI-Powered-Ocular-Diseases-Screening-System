{% extends 'base.html' %}

{% block title %}Login - Ocular AI{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-6 col-lg-4">
        <div class="glass-card p-5">
            <div class="text-center mb-4">
                <h2 class="fw-bold">Welcome Back</h2>
                <p class="text-muted">Login to continue screening</p>
            </div>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label text-muted">Username</label>
                    <div class="input-group">
                        <span class="input-group-text border-0 bg-transparent"><i
                                class="fas fa-user text-primary"></i></span>
                        <input type="text" name="username" class="form-control rounded-pill bg-light border-0 ps-3"
                            placeholder="Enter username" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted">Password</label>
                    <div class="input-group">
                        <span class="input-group-text border-0 bg-transparent"><i
                                class="fas fa-lock text-primary"></i></span>
                        <input type="password" name="password" class="form-control rounded-pill bg-light border-0 ps-3"
                            placeholder="Enter password" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 rounded-pill mb-3">Login</button>
                <div class="text-center">
                    <small>Don't have an account? <a href="{% url 'signup' %}" class="text-decoration-none fw-bold">Sign
                            Up</a></small>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
